name: Bug report
description: Something in RetrySight Cloud is not working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (see the dashboard footer or `VERSION`).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [Docker Compose, Helm, Built from source, Native agent installer]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, API keys and personal data before pasting.
      render: text
