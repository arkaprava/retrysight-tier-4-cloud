agent:
  platform:
    installation-tier: TIER_4_CLOUD

  manager:
    url: http://localhost:28477
    api-key: dev-agent-key

  collectors:
    - type: cursor
      enabled: true
      watch-path: ~/.cursor/projects
    - type: claude_code
      enabled: true
      watch-path: ~/.claude/projects
    - type: codex
      enabled: true
      watch-path: ~/.codex/sessions
    - type: kiro
      enabled: true
      watch-path: ~/.kiro/sessions/cli
    - type: copilot
      enabled: true
      watch-path: ~/.copilot/session-state
    - type: warp
      enabled: true
      watch-path: ~/Library/Group Containers/2BBY89MBSN.dev.warp/Library/Application Support/dev.warp.Warp-Stable/warp.sqlite

  privacy:
    store-full-prompts: false
