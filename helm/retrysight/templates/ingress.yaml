{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "retrysight.fullname" . }}
  labels:
    {{- include "retrysight.labels" . | nindent 4 }}
  {{- if .Values.ingress.className }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "retrysight.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "retrysight.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "retrysight.fullname" . }}-manager
                port:
                  number: {{ .Values.manager.port }}
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: {{ include "retrysight.fullname" . }}-manager
                port:
                  number: {{ .Values.manager.port }}
{{- end }}
