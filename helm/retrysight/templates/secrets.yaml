apiVersion: v1
kind: Secret
metadata:
  name: {{ include "retrysight.fullname" . }}-secrets
  labels:
    {{- include "retrysight.labels" . | nindent 4 }}
  annotations:
    # Generated passwords must survive uninstall/reinstall while the PVCs still exist.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ include "retrysight.secretValue" (list . "postgres-password" .Values.postgres.password 32) | quote }}
  jwt-secret: {{ include "retrysight.secretValue" (list . "jwt-secret" .Values.manager.jwtSecret 48) | quote }}
  agent-api-key: {{ include "retrysight.secretValue" (list . "agent-api-key" .Values.manager.agentApiKey 40) | quote }}
  secadmin-password: {{ include "retrysight.secretValue" (list . "secadmin-password" .Values.manager.secadminPassword 24) | quote }}
  sso-secret-key: {{ include "retrysight.secretValue" (list . "sso-secret-key" .Values.manager.ssoSecretKey 32) | quote }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-password: {{ include "retrysight.secretValue" (list . "clickhouse-password" .Values.clickhouse.password 32) | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  minio-root-user: {{ .Values.minio.rootUser | quote }}
  minio-root-password: {{ include "retrysight.secretValue" (list . "minio-root-password" .Values.minio.rootPassword 32) | quote }}
  {{- end }}
