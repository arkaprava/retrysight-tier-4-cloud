apiVersion: v1
kind: Service
metadata:
  name: {{ include "retrysight.fullname" . }}-manager
  labels:
    {{- include "retrysight.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.manager.port }}
      targetPort: manager
      name: http
  selector:
    {{- include "retrysight.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: manager
---
{{/* Alias hostname "manager" — frontend CDN image nginx upstream is hard-coded to manager:<port>. */}}
apiVersion: v1
kind: Service
metadata:
  name: manager
  labels:
    {{- include "retrysight.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
    app.kubernetes.io/component-alias: manager-short-name
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.manager.port }}
      targetPort: manager
      name: http
  selector:
    {{- include "retrysight.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retrysight.fullname" . }}-manager
  labels:
    {{- include "retrysight.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "retrysight.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        {{- include "retrysight.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "retrysight.componentImage" (dict "root" . "component" "manager") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.manager.port }}
              name: manager
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.tier.springProfiles | quote }}
            - name: MANAGER_PORT
              value: {{ .Values.manager.port | quote }}
            - name: POSTGRES_HOST
              value: {{ include "retrysight.fullname" . }}-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: jwt-secret
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: agent-api-key
            - name: SECADMIN_EMAIL
              value: {{ .Values.manager.secadminEmail | default "secadmin@local" | quote }}
            - name: SECADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: secadmin-password
            - name: SSO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: sso-secret-key
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.manager.corsAllowedOrigins | quote }}
            - name: SECURITY_ALLOW_DEFAULT_SECRETS
              value: {{ .Values.manager.allowDefaultSecrets | default false | quote }}
            - name: CLICKHOUSE_ENABLED
              value: {{ .Values.manager.clickhouseEnabled | quote }}
            - name: OTEL_INGEST_ENABLED
              value: {{ .Values.manager.otelIngestEnabled | quote }}
            {{- if .Values.clickhouse.enabled }}
            - name: CLICKHOUSE_READ_ENABLED
              value: "true"
            - name: CLICKHOUSE_URL
              value: {{ printf "http://%s-clickhouse:8123" (include "retrysight.fullname" .) | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: clickhouse-password
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            {{- end }}
            {{- if .Values.minio.enabled }}
            - name: ARCHIVE_S3_ENDPOINT
              value: {{ printf "http://%s-minio:9000" (include "retrysight.fullname" .) | quote }}
            - name: ARCHIVE_S3_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: ARCHIVE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: minio-root-user
            - name: ARCHIVE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "retrysight.fullname" . }}-secrets
                  key: minio-root-password
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/auth/sso/status
              port: manager
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/auth/sso/status
              port: manager
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
